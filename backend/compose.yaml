services:

  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: ecommerce
      POSTGRES_USER: ecommerce
      POSTGRES_PASSWORD: ecommerce_password

    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql:ro

    ports:
      - "5432:5432"

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ecommerce -d ecommerce"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s

  backend:
    build:
      context: .

    env_file:
      - .env

    ports:
      - "5000:5000"

    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: ../frontend

    ports:
      - "8080:80"

    depends_on:
      - backend

volumes:
  postgres-data:
