name: CI

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

permissions:
  contents: read
  id-token: write

jobs:

  # ==================================================
  # JOB 1 — TESTS + DOCKER BUILD
  # ==================================================

  backend-tests:
    name: Backend Tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16

        env:
          POSTGRES_DB: ecommerce
          POSTGRES_USER: ecommerce
          POSTGRES_PASSWORD: ecommerce

        ports:
          - 5432:5432

        options: >-
          --health-cmd "pg_isready -U ecommerce -d ecommerce"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
          --health-start-period 10s

    defaults:
      run:
        working-directory: backend

    steps:

      # --------------------------------------------------
      # Checkout
      # --------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4

      # --------------------------------------------------
      # Node.js
      # --------------------------------------------------
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json

      # --------------------------------------------------
      # Install dependencies
      # --------------------------------------------------
      - name: Install dependencies
        run: npm ci

      # --------------------------------------------------
      # Unit tests
      # --------------------------------------------------
      - name: Run unit tests
        run: npm run test:unit

      # --------------------------------------------------
      # PostgreSQL client
      # --------------------------------------------------
      - name: Install PostgreSQL client
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client

      # --------------------------------------------------
      # Wait for PostgreSQL
      # --------------------------------------------------
      - name: Wait for PostgreSQL
        run: |
          echo "Waiting for PostgreSQL..."

          for i in {1..30}; do
            if pg_isready \
              -h localhost \
              -p 5432 \
              -U ecommerce \
              -d ecommerce
            then
              echo "PostgreSQL is ready."
              break
            fi

            echo "PostgreSQL not ready yet. Attempt $i/30"
            sleep 2
          done

          pg_isready \
            -h localhost \
            -p 5432 \
            -U ecommerce \
            -d ecommerce

      # --------------------------------------------------
      # Initialize database
      # --------------------------------------------------
      - name: Initialize database
        env:
          PGPASSWORD: ecommerce
        run: |
          psql \
            -h localhost \
            -p 5432 \
            -U ecommerce \
            -d ecommerce \
            -v ON_ERROR_STOP=1 \
            -f database/init.sql

      # --------------------------------------------------
      # Integration tests
      # --------------------------------------------------
      - name: Run integration tests
        env:
          DB_HOST: localhost
          DB_PORT: 5432
          DB_NAME: ecommerce
          DB_USER: ecommerce
          DB_PASSWORD: ecommerce
        run: npm run test:integration

      # --------------------------------------------------
      # Build Docker image
      # --------------------------------------------------
      - name: Build backend Docker image
        run: |
          docker build \
            -t ecommerce-backend:${{ github.sha }} \
            .


  # ==================================================
  # JOB 2 — AWS OIDC
  # ==================================================

  build-and-push:
    name: Build and Push Docker Image
    runs-on: ubuntu-latest

    # This job cannot start until backend-tests succeeds.
    needs:
      - backend-tests

    # Only publish from a direct push to main.
    # Pull requests will not receive AWS access.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:

      # --------------------------------------------------
      # Checkout
      # --------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4

      # --------------------------------------------------
      # Build Docker image
      #
      # This is a NEW runner, so the image from Job 1
      # does not exist here.
      # --------------------------------------------------
      - name: Build backend Docker image
        working-directory: backend
        run: |
          docker build \
            -t ecommerce-backend:${{ github.sha }} \
            .

      # --------------------------------------------------
      # TEMPORARY OIDC DEBUGGING
      # --------------------------------------------------
      - name: Debug OIDC token
        uses: github/actions-oidc-debugger@main

      # --------------------------------------------------
      # GitHub OIDC → AWS STS → IAM Role
      # --------------------------------------------------
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::271758791430:role/GitHubActionsECRPushEcommerce
          aws-region: us-east-1

      # --------------------------------------------------
      # Verify assumed AWS identity
      # --------------------------------------------------
      - name: Verify AWS identity
        run: |
          aws sts get-caller-identity


