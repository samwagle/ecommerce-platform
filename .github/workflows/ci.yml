name: CI and Push Docker Image to Amazon ECR

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

# Nothing by default. Each job asks for only what it needs.
permissions: {}

env:
  AWS_REGION: us-east-1
  ROLE_TO_ASSUME: arn:aws:iam::271758791430:role/GitHubActionsECRPushEcommerce
  ECR_REPOSITORY: ecommerce-backend

jobs:

  # ==================================================
  # JOB 1: TESTS (no AWS access, runs on PRs and pushes)
  # ==================================================
  backend-tests:
    name: Backend Tests
    runs-on: ubuntu-latest

    permissions:
      contents: read

    services:
      postgres:
        image: postgres:16

        env:
          POSTGRES_DB: ecommerce
          POSTGRES_USER: ecommerce
          POSTGRES_PASSWORD: ecommerce

        ports:
          - 5432:5432

        options: >-
          --health-cmd "pg_isready -U ecommerce -d ecommerce"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
          --health-start-period 10s

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests
        run: npm run test:unit

      - name: Install PostgreSQL client
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client

      - name: Wait for PostgreSQL
        run: |
          for i in {1..30}; do
            if pg_isready -h localhost -p 5432 -U ecommerce -d ecommerce; then
              echo "PostgreSQL is ready."
              break
            fi
            echo "PostgreSQL not ready yet. Attempt $i/30"
            sleep 2
          done

          pg_isready -h localhost -p 5432 -U ecommerce -d ecommerce

      - name: Initialize database
        env:
          PGPASSWORD: ecommerce
        run: |
          psql \
            -h localhost \
            -p 5432 \
            -U ecommerce \
            -d ecommerce \
            -v ON_ERROR_STOP=1 \
            -f database/init.sql

      - name: Run integration tests
        env:
          DB_HOST: localhost
          DB_PORT: 5432
          DB_NAME: ecommerce
          DB_USER: ecommerce
          DB_PASSWORD: ecommerce
        run: npm run test:integration


  # ==================================================
  # JOB 2: BUILD ONCE + PUSH TO ECR (main branch only)
  # The only job allowed to request an OIDC token.
  # ==================================================
  build-and-push:
    name: Build and Push Image
    runs-on: ubuntu-latest
    needs: backend-tests

    # Runs for pushes to main, or a manual run started from main.
    # The IAM trust policy only allows refs/heads/main.
    if: github.ref == 'refs/heads/main'

    permissions:
      id-token: write   # Essential for OIDC token federation with AWS IAM
      contents: read

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # TEMPORARY DEBUG STEP: delete once the role assumption works.
      # Prints the claims AWS compares against the trust policy.
      - name: Inspect OIDC claims
        shell: bash
        run: |
          set -euo pipefail
          TOKEN_JSON="$(curl -sSf \
            -H "Authorization: Bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=sts.amazonaws.com")"
          PAYLOAD="$(echo "$TOKEN_JSON" | jq -r .value | cut -d '.' -f 2 | tr '_-' '/+')"
          case $((${#PAYLOAD} % 4)) in
            2) PAYLOAD="${PAYLOAD}==" ;;
            3) PAYLOAD="${PAYLOAD}=" ;;
          esac
          echo "$PAYLOAD" | base64 -d | jq '{iss, aud, sub, repository, ref}'

      # 1. Authenticate to AWS via OIDC (no long-lived access keys)
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.ROLE_TO_ASSUME }}
          aws-region: ${{ env.AWS_REGION }}
          audience: sts.amazonaws.com

      # 2. Log in to Amazon ECR private registry
      - name: Log in to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      # 3. Set up Docker Buildx for layer caching
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # 4. Image tag (commit SHA) and OCI labels
      - name: Extract Docker Metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}
          tags: |
            type=sha,format=short,prefix=

      # 5. Build once and push, with GitHub Actions layer caching
      - name: Build and Push Docker Image
        uses: docker/build-push-action@v6
        with:
          context: backend
          file: backend/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
