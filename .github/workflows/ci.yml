name: CI

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

permissions:
  contents: read
  id-token: write

jobs:

  # ==================================================
  # JOB 1 — TESTS
  # ==================================================

  backend-tests:
    name: Backend Tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16

        env:
          POSTGRES_DB: ecommerce
          POSTGRES_USER: ecommerce
          POSTGRES_PASSWORD: ecommerce

        ports:
          - 5432:5432

        options: >-
          --health-cmd "pg_isready -U ecommerce -d ecommerce"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
          --health-start-period 10s

    defaults:
      run:
        working-directory: backend

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests
        run: npm run test:unit

      - name: Install PostgreSQL client
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client

      - name: Wait for PostgreSQL
        run: |
          echo "Waiting for PostgreSQL..."

          for i in {1..30}; do
            if pg_isready \
              -h localhost \
              -p 5432 \
              -U ecommerce \
              -d ecommerce
            then
              echo "PostgreSQL is ready."
              break
            fi

            echo "PostgreSQL not ready yet. Attempt $i/30"
            sleep 2
          done

          pg_isready \
            -h localhost \
            -p 5432 \
            -U ecommerce \
            -d ecommerce

      - name: Initialize database
        env:
          PGPASSWORD: ecommerce
        run: |
          psql \
            -h localhost \
            -p 5432 \
            -U ecommerce \
            -d ecommerce \
            -v ON_ERROR_STOP=1 \
            -f database/init.sql

      - name: Run integration tests
        env:
          DB_HOST: localhost
          DB_PORT: 5432
          DB_NAME: ecommerce
          DB_USER: ecommerce
          DB_PASSWORD: ecommerce
        run: npm run test:integration

      - name: Build backend Docker image
        run: |
          docker build \
            -t ecommerce-backend:${{ github.sha }} \
            .


  # ==================================================
  # JOB 2 — BUILD + AWS AUTHENTICATION PROCESS
  # ==================================================

  build-and-push:
    name: Build and Push Docker Image
    runs-on: ubuntu-latest

    needs:
      - backend-tests

    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:

      # Fresh runner needs source code
      - name: Checkout repository
        uses: actions/checkout@v4

      # Build image BEFORE AWS authentication
      - name: Build backend Docker image
        working-directory: backend
        run: |
          docker build \
            -t ecommerce-backend:${{ github.sha }} \
            .

      # GitHub OIDC → AWS STS → IAM Role
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::271758791430:role/GitHubActionsECRPushEcommerce
          aws-region: us-east-1

      # Verify that OIDC authentication worked
      - name: Verify AWS identity
        run: aws sts get-caller-identity
