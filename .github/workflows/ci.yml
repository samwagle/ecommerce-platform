name: CI and Push Docker Image to Amazon ECR

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

  workflow_dispatch:

# Nothing by default.
# Each job requests only the permissions it actually needs.
permissions: {}

env:
  AWS_REGION: us-east-1
  ROLE_TO_ASSUME: arn:aws:iam::271758791430:role/GitHubActionsECRPushEcommerce
  ECR_REPOSITORY: ecommerce-backend

jobs:

  # ==================================================
  # JOB 1: BACKEND TESTS
  #
  # Runs on:
  # - Pull requests
  # - Pushes to main
  # - Manual workflow runs
  #
  # No AWS access.
  # ==================================================

  backend-tests:
    name: Backend Tests
    runs-on: ubuntu-latest

    permissions:
      contents: read

    services:
      postgres:
        image: postgres:16

        env:
          POSTGRES_DB: ecommerce
          POSTGRES_USER: ecommerce
          POSTGRES_PASSWORD: ecommerce

        ports:
          - 5432:5432

        options: >-
          --health-cmd "pg_isready -U ecommerce -d ecommerce"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
          --health-start-period 10s

    defaults:
      run:
        working-directory: backend

    steps:

      # ----------------------------------------------
      # Checkout source code
      # ----------------------------------------------

      - name: Checkout repository
        uses: actions/checkout@v4


      # ----------------------------------------------
      # Node.js
      # ----------------------------------------------

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json


      # ----------------------------------------------
      # Install dependencies
      # ----------------------------------------------

      - name: Install dependencies
        run: npm ci


      # ----------------------------------------------
      # Unit tests
      # ----------------------------------------------

      - name: Run unit tests
        run: npm run test:unit


      # ----------------------------------------------
      # PostgreSQL client
      #
      # PostgreSQL server:
      # GitHub Actions service container
      #
      # PostgreSQL client:
      # GitHub runner
      # ----------------------------------------------

      - name: Install PostgreSQL client
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client


      # ----------------------------------------------
      # Wait for PostgreSQL
      # ----------------------------------------------

      - name: Wait for PostgreSQL
        run: |
          for i in {1..30}; do
            if pg_isready \
              -h localhost \
              -p 5432 \
              -U ecommerce \
              -d ecommerce
            then
              echo "PostgreSQL is ready."
              break
            fi

            echo "PostgreSQL not ready yet. Attempt $i/30"
            sleep 2
          done

          pg_isready \
            -h localhost \
            -p 5432 \
            -U ecommerce \
            -d ecommerce


      # ----------------------------------------------
      # Initialize database
      # ----------------------------------------------

      - name: Initialize database
        env:
          PGPASSWORD: ecommerce
        run: |
          psql \
            -h localhost \
            -p 5432 \
            -U ecommerce \
            -d ecommerce \
            -v ON_ERROR_STOP=1 \
            -f database/init.sql


      # ----------------------------------------------
      # Integration tests
      # ----------------------------------------------

      - name: Run integration tests
        env:
          DB_HOST: localhost
          DB_PORT: 5432
          DB_NAME: ecommerce
          DB_USER: ecommerce
          DB_PASSWORD: ecommerce
        run: npm run test:integration


  # ==================================================
  # JOB 2: BUILD → SCAN → PUSH
  #
  # Runs only after backend-tests succeeds.
  #
  # Only this job can request a GitHub OIDC token.
  # ==================================================

  build-and-push:
    name: Build, Scan and Push Image
    runs-on: ubuntu-latest

    needs:
      - backend-tests

    # Only push images from main.
    #
    # Pull requests may run Job 1, but they do not
    # publish images to ECR.
    if: github.ref == 'refs/heads/main'

    permissions:
      contents: read
      id-token: write

    steps:

      # ----------------------------------------------
      # Checkout source code
      # ----------------------------------------------

      - name: Checkout repository
        uses: actions/checkout@v4


      # ----------------------------------------------
      # AWS authentication
      #
      # GitHub OIDC
      #       ↓
      # AWS STS
      #       ↓
      # Temporary IAM role credentials
      # ----------------------------------------------

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.ROLE_TO_ASSUME }}
          aws-region: ${{ env.AWS_REGION }}
          audience: sts.amazonaws.com


      # ----------------------------------------------
      # Authenticate Docker with ECR
      # ----------------------------------------------

      - name: Log in to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2


      # ----------------------------------------------
      # Docker Buildx
      # ----------------------------------------------

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3


      # ----------------------------------------------
      # Docker image metadata
      #
      # Full Git commit SHA is used as the image tag.
      #
      # Example:
      #
      # ecommerce-backend:
      # 8d3f67ad463ac980ce3dfbd2611e2a9dd5089771
      #
      # ECR repository is configured as immutable.
      # ----------------------------------------------

      - name: Extract Docker Metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}
          tags: |
            type=sha,format=long


      # ----------------------------------------------
      # Build Docker image
      #
      # IMPORTANT:
      #
      # push=false
      #   → do NOT push yet
      #
      # load=true
      #   → load image into local Docker engine
      #      so Trivy can scan it
      # ----------------------------------------------

      - name: Build Docker Image
        uses: docker/build-push-action@v6
        with:
          context: backend
          file: backend/Dockerfile

          push: false
          load: true

          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

          provenance: false

          cache-from: type=gha
          cache-to: type=gha,mode=max


      # ----------------------------------------------
      # Trivy container image security scan
      #
      # Blocking policy:
      #
      # HIGH     → fail if fixed vulnerability exists
      # CRITICAL → fail if fixed vulnerability exists
      #
      # Unfixed vulnerabilities are ignored.
      # MEDIUM and LOW do not block the pipeline.
      # ----------------------------------------------

      - name: Scan Docker image with Trivy
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ steps.meta.outputs.tags }}
          format: table
          exit-code: '1'
          ignore-unfixed: true
          severity: CRITICAL,HIGH


      # ----------------------------------------------
      # Push only if Trivy succeeds.
      # ----------------------------------------------

      - name: Push Docker image to ECR
        run: |
          docker push ${{ steps.meta.outputs.tags }}
