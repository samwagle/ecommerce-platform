server {
    listen 80;
    server_name localhost;

    # 1. Serve static frontend assets built by Vite
    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        # Essential for Single Page Applications (React Router)
        # If a path isn't a physical file, fall back to index.html
        try_files $uri $uri/ /index.html;
    }

    # 2. Reverse proxy API traffic to the backend
    location /api/ {
        # Forward requests to backend running on your host machine
        proxy_pass http://backend:5000/api/;
        
        # Standard proxy headers to preserve original client request info
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'keep-alive';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
    }
}
